<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jargon: All Entries</title>
  <style>
    body { font: 16px/1.45 system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    article { border-top: 1px solid #ddd; padding: 1rem 0; position: relative; }
    .edit { position: absolute; right: 0; top: 1rem; color: #888; font-size: .9rem; text-decoration: none; }
    .edit:hover { text-decoration: underline; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>All Entries</h1>
  <p id="status" class="muted">Loading…</p>
  <div id="list"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (async () => {
      const status = document.getElementById("status");
      const list = document.getElementById("list");
      const idFor = (name) => encodeURIComponent(name);

      try {
        const files = await fetch(
          "https://api.github.com/repos/Schmavery/jargon/contents/entries?ref=main"
        ).then((r) => {
          if (!r.ok) throw new Error(`GitHub API ${r.status}`);
          return r.json();
        });

        const mdFiles = files
          .filter((f) => f.type === "file" && /\.md$/i.test(f.name))
          .sort((a, b) => a.name.localeCompare(b.name));

        const names = new Set(mdFiles.map((f) => f.name.toLowerCase()));
        const docs = await Promise.all(
          mdFiles.map(async (f) => ({
            name: f.name,
            text: await fetch(f.download_url).then((r) => r.text()),
          }))
        );

        list.innerHTML = docs.map((doc) => `
          <article id="${idFor(doc.name)}">
            <a class="edit"
               href="https://github.com/Schmavery/jargon/edit/main/entries/${encodeURIComponent(doc.name)}"
               target="_blank" rel="noopener noreferrer">edit</a>
            ${marked.parse(doc.text)}
          </article>
        `).join("");

        list.querySelectorAll('a[href]').forEach((a) => {
          const href = a.getAttribute("href") || "";
          if (/^(https?:|mailto:|#)/i.test(href)) return;

          const file = decodeURIComponent(
            href.split("?")[0].split("#")[0].split("/").pop() || ""
          );

          if (names.has(file.toLowerCase())) {
            a.setAttribute("href", `#${idFor(file)}`);
          } else if (!/\.md$/i.test(file) && names.has(`${file.toLowerCase()}.md`)) {
            a.setAttribute("href", `#${idFor(file + ".md")}`);
          }
        });

        status.remove();
      } catch (e) {
        status.textContent = `Failed to load entries: ${e.message}`;
      }
    })();
  </script>
</body>
</html>
